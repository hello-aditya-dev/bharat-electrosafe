name: Deploy to GitHub Pages

# Deploys a static export of the Bharat Electrosafe website to GitHub Pages.
#
# This workflow is ADDITIVE — it does not affect the existing Hostinger
# production deployment in any way. The static export is produced by setting
# DEPLOY_TARGET=pages at build time, which activates the conditional
# `output: 'export'` branch in next.config.mjs. When that env var is absent
# (Hostinger build, local dev, the existing CI workflow), the config is
# byte-for-byte identical to the pre-Pages configuration.
#
# Known limitations of the Pages preview (by design — GitHub Pages serves
# static files only):
#   - The /api/contact SMTP contact form cannot submit (no server runtime).
#     Production on Hostinger remains fully functional.
#   - sitemap.xml, robots.txt and manifest.webmanifest are not generated for
#     the Pages preview (they read build-time env vars that make them
#     dynamic; they are temporarily relocated during the export build and
#     restored immediately after). Production on Hostinger is unaffected.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment, cancelling runs in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare static export (temporarily relocate server-only routes)
        # The /api contact route (SMTP), sitemap.ts, robots.ts and manifest.ts
        # are dynamic server routes that `output: 'export'` cannot build.
        # They are moved out of the app directory for the duration of the
        # export build and restored immediately after, so the committed
        # source tree is never modified.
        run: |
          mkdir -p .pages-backup
          mv src/app/api .pages-backup/api
          mv src/app/sitemap.ts .pages-backup/sitemap.ts
          mv src/app/robots.ts .pages-backup/robots.ts
          mv src/app/manifest.ts .pages-backup/manifest.ts
          echo "Relocated server-only routes for static export build."

      - name: Build static export
        env:
          DEPLOY_TARGET: pages
          NEXT_PUBLIC_SITE_URL: https://hello-aditya-dev.github.io/bharat-electrosafe
          ALLOW_INDEXING: 'false'
          # Placeholder SMTP values — the contact API route is excluded from
          # the export build, so these are never used. They only satisfy any
          # module-level env reads in shared libraries.
          SMTP_HOST: placeholder
          SMTP_PORT: '587'
          SMTP_USER: placeholder
          SMTP_PASSWORD: placeholder
          SMTP_SECURE: 'false'
          MAIL_FROM: placeholder@example.com
          MAIL_TO: placeholder@example.com
        run: npm run build

      - name: Restore relocated server-only routes
        if: always()
        run: |
          if [ -d .pages-backup ]; then
            [ -d .pages-backup/api ] && mv .pages-backup/api src/app/api 2>/dev/null || true
            [ -f .pages-backup/sitemap.ts ] && mv .pages-backup/sitemap.ts src/app/sitemap.ts 2>/dev/null || true
            [ -f .pages-backup/robots.ts ] && mv .pages-backup/robots.ts src/app/robots.ts 2>/dev/null || true
            [ -f .pages-backup/manifest.ts ] && mv .pages-backup/manifest.ts src/app/manifest.ts 2>/dev/null || true
            rmdir .pages-backup 2>/dev/null || true
            echo "Restored server-only routes."
          fi

      - name: Disable Jekyll processing
        # GitHub Pages runs Jekyll by default, which ignores folders starting
        # with `_` (Next.js outputs assets to `_next/`). This empty file
        # tells Pages to serve everything as-is.
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
